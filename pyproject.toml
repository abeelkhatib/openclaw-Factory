[project]
name = "openclaw-factory"
version = "0.1.0"
description = "OpenClaw-style content factory foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "boto3>=1.34.0",
  "fastapi>=0.115.0",
  "ffmpeg-python>=0.2.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "redis[asyncio]>=5.0.0",
  "sqlalchemy>=2.0.31",
  "temporalio>=1.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
orchestrator-api = "openclaw_orchestrator_api.main:run"
worker = "openclaw_worker.worker:run"
plan-validator-api = "openclaw_plan_validator.main:run"
smoke = "scripts.smoke:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "apps/orchestrator_api",
  "apps/worker",
  "apps/plan_validator",
  "packages/shared",
  "scripts",
]
